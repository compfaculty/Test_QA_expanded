<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ammeter Test UI</title>
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/app.js"></script>
</head>
<body>
    <header class="topbar">
        <h1>Ammeter Test Dashboard</h1>
        <nav class="tabs">
            <a class="tab {% if active_page == 'config' %}active{% endif %}" href="/config">Config</a>
            <a class="tab {% if active_page == 'start' %}active{% endif %}" href="/start">Start Test</a>
            <a class="tab {% if active_page == 'runs' %}active{% endif %}" href="/runs">Historical Runs</a>
            <a class="tab {% if active_page == 'visualize' %}active{% endif %}" href="/visualize">Visualize & Compare</a>
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
